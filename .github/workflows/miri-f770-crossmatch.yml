name: Shabgard F770W COSMOS2025 counterparts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/miri-f770-crossmatch.yml'
      - 'scripts/miri_f770_cosmos2025_crossmatch.py'
permissions:
  contents: read
  actions: read
jobs:
  counterparts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-f770-network
          run-id: 45626983126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - run: python -m pip install numpy astropy astroquery
      - run: python scripts/miri_f770_cosmos2025_crossmatch.py inputs/reference_sources.csv counterpart_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shabgard-f770-counterparts
          path: counterpart_results/
          if-no-files-found: warn
