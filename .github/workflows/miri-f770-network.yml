name: Shabgard F770W relative astrometric network
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/miri-f770-network.yml'
      - 'scripts/miri_f770_network_registration.py'
permissions:
  contents: read
  actions: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-f770-field-controls
          run-id: 45582311047
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - run: python -m pip install numpy scipy
      - name: Solve all-dither source network
        run: python scripts/miri_f770_network_registration.py inputs/field_results/field_candidates.csv network_results
      - uses: actions/upload-artifact@v4
        with:
          name: shabgard-f770-network
          path: network_results/
