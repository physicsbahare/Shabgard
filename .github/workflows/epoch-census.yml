name: Shabgard HST + JWST epoch census

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "target.json"
      - "requirements.txt"
      - ".github/workflows/epoch-census.yml"
  schedule:
    - cron: "13 * * * *"  # hourly UTC; best effort GitHub scheduling

permissions:
  contents: write

concurrency:
  group: shabgard-archive-census
  cancel-in-progress: false

jobs:
  mast-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install astronomy dependencies
        run: python -m pip install -r requirements.txt
      - name: Query MAST for HST and JWST at Shabgard
        id: census
        continue-on-error: true
        run: python scripts/search_mast_epochs.py --target target.json --out results
      - name: Incremental science product metadata retrieval
        if: steps.census.outcome == 'success'
        continue-on-error: true
        run: python scripts/fetch_science_products.py --out results --batch-size 3
      - name: Commit results and query status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Shabgard HST/JWST MAST epoch census"
            git push
          fi
      - name: Fail if MAST query failed
        if: steps.census.outcome != 'success'
        run: |
          echo "MAST query did not finish; see results/status.json and run logs."
          exit 1
