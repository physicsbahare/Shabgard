name: Shabgard F770W target relative astrometry
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/miri-f770-target.yml'
      - 'scripts/miri_f770_target_relative_astrometry.py'
permissions:
  contents: read
  actions: read
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-miri-covered-dithers
          run-id: 45411830409
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostic
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-miri-stpsf
          run-id: 45553291617
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: psf
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-f770-network
          run-id: 45626983126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: network
      - run: python -m pip install 'jwst>=1.17,<3' scipy matplotlib requests
      - name: Download original F770W CAL files
        run: |
          python scripts/select_miri_cal_pilot.py --results results --out miri_results --max-per-observation 8 --filters F770W --obsids 200464999 --pointings jw01727016001
          python scripts/download_miri_cal_batch.py --selection miri_results/miri_cal_selection.csv --out miri_data --report miri_results/miri_download_manifest.csv --max-files 8
      - name: Project fitted centroids and propagate relative registration covariance
        run: python scripts/miri_f770_target_relative_astrometry.py --cal miri_data --diagnostic diagnostic/miri_cal_detector_diagnostic.csv --psf psf/miri_stpsf_diagnostic.csv --network network --out target_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shabgard-f770-target-relative
          path: |
            target_results/
            miri_results/miri_download_manifest.csv
          if-no-files-found: warn
