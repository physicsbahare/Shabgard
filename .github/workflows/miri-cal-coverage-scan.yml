name: Shabgard MIRI all-pointing gWCS coverage scan
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/miri-cal-coverage-scan.yml'
permissions:
  contents: read
concurrency:
  group: shabgard-miri-pointing-scan
  cancel-in-progress: false
jobs:
  detector-miri-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive and calibrated JWST tools
        run: python -m pip install 'jwst>=1.17,<3' 'astroquery>=0.4.11,<1' scipy
      - name: Select one CAL exposure per actual F1000W F1280W F1500W pointing
        run: |
          python scripts/select_miri_cal_pilot.py --results results --out miri_results --max-per-observation 24 --filters F1000W F1280W F1500W --no-live-query
          cat miri_results/miri_cal_selection_summary.json
      - name: Download CAL exposure for each sampled pointing
        run: python scripts/download_miri_cal_batch.py --selection miri_results/miri_cal_selection.csv --out miri_data --report miri_results/miri_download_manifest.csv --max-files 56
      - name: Identify real detector SCI DQ gWCS coverage and derive local aperture diagnostics
        run: |
          python scripts/miri_calibration_pilot.py 'miri_data/*_mirimage_cal.fits' --out miri_results
          cat miri_results/miri_cal_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shabgard-miri-pointing-coverage
          path: miri_results/
          if-no-files-found: warn
          retention-days: 45
