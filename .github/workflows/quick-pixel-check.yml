name: Priority Shabgard image WCS check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/quick-pixel-check.yml"

permissions:
  contents: write

concurrency:
  group: shabgard-priority-pixel-check
  cancel-in-progress: false

jobs:
  priority-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MAST and FITS tools
        run: python -m pip install -r requirements.txt
      - name: Prepare isolated priority audit
        run: |
          mkdir -p quick_results
          cp results/observations.csv quick_results/observations.csv
      - name: Retrieve priority JWST 7814 and MIRI FITS product metadata
        run: python scripts/fetch_science_products.py --out quick_results --batch-size 14
      - name: Verify FITS image WCS footprints for priority products
        run: python scripts/audit_mosaic_wcs.py --out quick_results --target target.json --limit 12 --timeout 25
      - name: Commit priority coverage evidence without touching main results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quick_results/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Record priority FITS-WCS evidence for Shabgard"
            git pull --rebase origin main
            git push origin main
          fi
