name: Shabgard NIRCam fourth epoch
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/nircam_fourth_epoch.py'
      - '.github/workflows/nircam-fourth-epoch.yml'
permissions:
  contents: read
  actions: read
jobs:
  fourth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-nircam-same-filter
          run-id: 45795708087
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - run: python -m pip install 'jwst>=1.17,<3' 'astroquery>=0.4.11,<1' scipy matplotlib requests fsspec aiohttp
      - name: Fit F140M target and reference network and obtain JWST parallax factors
        run: python -u scripts/nircam_fourth_epoch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shabgard-nircam-fourth-epoch
          path: fourth_epoch/
          if-no-files-found: warn
