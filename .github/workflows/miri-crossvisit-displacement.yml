name: Shabgard F770W cross-visit displacement
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/miri-crossvisit-displacement.yml'
      - 'scripts/miri_crossvisit_displacement.py'
permissions:
  contents: read
  actions: read
jobs:
  displacement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-fifth-epoch-primer2022
          run-id: 45815669496
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: primer
      - uses: actions/download-artifact@v4
        with:
          name: shabgard-primer2022-f770-science
          run-id: 45818321064
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: network
      - uses: actions/download-artifact@v4
        with:
          run-id: 45748501114
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: positions2024
      - run: pip install 'jwst>=1.17,<3' 'astroquery>=0.4.11,<1' scipy requests
      - name: Retrieve four 2022 original CALs
        run: |
          mkdir -p cal
          for seq in 02101 04101; do
            for n in 00001 00002; do
              f="jw01837004006_${seq}_${n}_mirimage_cal.fits"
              curl --fail --location --retry 2 --max-time 240 "https://mast.stsci.edu/api/v0.1/Download/file?uri=mast:JWST/product/${f}" -o "cal/${f}"
            done
          done
      - run: python -u scripts/miri_crossvisit_displacement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shabgard-f770-crossvisit-displacement
          path: displacement/
          if-no-files-found: warn
